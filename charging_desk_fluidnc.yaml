# FluidNC config for the crossed-rod charger mover (ESP32 dev board, ESP-WROOM-32).
#
# DRAFT written from memory of the FluidNC config format. Not run on real hardware.
# If FluidNC rejects a key, check the config docs for your FluidNC version.
#
# Two independent axes (plain Cartesian, NO CoreXY):
#   X motor spins the X track (belt along the long edge)  -> moves rod 1 -> sets the puck's X
#   Y motor spins the Y track (belt along the short edge) -> moves rod 2 -> sets the puck's Y
#
# How to use: open the FluidNC web UI (http://fluidnc.local or the IP it prints on serial),
# upload this as config.yaml (or paste it into the config editor), then restart.
#
# WIRING (change the pins below to match what you actually wire):
#   X motor driver: STEP gpio26, DIR gpio27
#   Y motor driver: STEP gpio25, DIR gpio33
#   Shared driver ENABLE: gpio13 (active low on A4988/DRV8825/TMC2209 standalone)
#   X limit switch (at the motor end of the X track, i.e. min X): gpio32, to GND, internal pull-up
#   Y limit switch (at the motor end of the Y track, i.e. min Y): gpio4,  to GND, internal pull-up
#   Common ground between the ESP32, the drivers and the motor supply. 12-24 V motor supply.
#
# steps_per_mm: GT2 belt, 20-tooth pulley = 40 mm per revolution.
#   200 steps/rev x 16 microstepping / 40 mm = 80 steps/mm. Change if you use other microstepping.
#
# FIRST RUN: jog before you ever home. In the web UI or a serial terminal send
#   $J=G91 X5 F500      (rod 1 should move 5 mm toward +X, i.e. away from the X motor)
#   $J=G91 Y5 F500      (rod 2 should move 5 mm toward +Y, i.e. away from the Y motor)
# If an axis goes the wrong way, add or remove ":low" on that axis' direction pin. If a limit
# switch is wired normally-open, check "$Limits" or the web UI pin status before homing.

name: "Charging Desk Crossed Rods"
board: ESP32 dev controller

stepping:
  engine: RMT
  idle_ms: 250
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: gpio.13

  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 6000
    acceleration_mm_per_sec2: 300
    max_travel_mm: 434          # puck reach in X from the CAD
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 100
      seek_mm_per_min: 800
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.32:low:pu
      hard_limits: false
      pulloff_mm: 3
      standard_stepper:
        step_pin: gpio.26
        direction_pin: gpio.27

  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 6000
    acceleration_mm_per_sec2: 300
    max_travel_mm: 242          # puck reach in Y from the CAD
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 100
      seek_mm_per_min: 800
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.4:low:pu
      hard_limits: false
      pulloff_mm: 3
      standard_stepper:
        step_pin: gpio.25
        direction_pin: gpio.33

start:
  must_home: false
